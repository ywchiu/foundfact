<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoundFact settings</title>
  <link rel="stylesheet" href="../shared/report.css">
  <style>
    body { margin: 0; background: var(--vf-bg); color: var(--vf-text); font-family: var(--vf-font); }
    main { max-width: 560px; margin: 0 auto; padding: 28px 16px; }
    label { display: block; font-weight: 600; margin: 18px 0 6px; }
    input, select { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--vf-line); background: var(--vf-surface); color: var(--vf-text); font: inherit; box-sizing: border-box; }
    .hint { color: var(--vf-muted); font-size: 13px; margin-top: 4px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
    .row input { width: auto; }
    #saved { color: var(--vf-green); margin-left: 8px; }
    button { margin-top: 20px; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--vf-accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>FoundFact</h1>
  <div class="row"><input type="checkbox" id="enabled"><label for="enabled" style="margin:0">Mark posts in my feed</label></div>
  <label for="lang">Report language</label>
  <select id="lang"><option value="zh">中文</option><option value="en">English</option></select>
  <p class="hint">Use your own keys. Requests go directly to your providers.</p>
  <label for="jevService">Feed screening service</label>
  <select id="jevService"><option value="openrouter">OpenRouter — Jev</option><option value="typesafe">TypeSafe — Jev</option></select>
  <label for="jevKey">Jev API key</label>
  <input id="jevKey" type="password" autocomplete="off" spellcheck="false" placeholder="OpenRouter or TypeSafe key">
  <p class="hint">Visible posts use Jev only.</p>
  <label for="museKey">Meta Muse API key</label>
  <input id="museKey" type="password" autocomplete="off" spellcheck="false" placeholder="Meta Model API key">
  <p class="hint">A full Muse investigation starts when you click Why.</p>
  <label for="screenHourlyLimit">Screenings per hour</label>
  <input id="screenHourlyLimit" type="number" min="0" max="100000" step="1">
  <label for="verifyHourlyLimit">Full checks per hour</label>
  <input id="verifyHourlyLimit" type="number" min="0" max="100000" step="1">
  <p class="hint">0 = no local cap. Provider limits still apply. Keys stay in this browser and are never synced.</p>
  <button id="save" type="button">Save</button><span id="saved"></span>
</main>
<script type="module" src="options.js"></script>
</body>
</html>
